name:java ci/cd pipeline
on:
push:
  branches:["main"]
  workflow_dispatch:
  jobs:
  build:
    runs-on:windows-latest

    steps:
    -name:Checkout respository
    uses:actions/checkout@v4

    -name:Set up JDK 21
    uses:actions/setup-java@v4
    with:
       java-version:'21'
       distribution:'temurin'

    -name:Compile java  Program
    run:javac New.java

    -name:Run Java Program 
     run:java New